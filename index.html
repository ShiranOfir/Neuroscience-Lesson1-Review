<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dff7ed" />
  <meta name="color-scheme" content="light" />
  <title>מסע בין שתי ההמיספרות</title>
  <meta name="description" content="משחק חזרה קצר על מבנה המוח, המיספרות ו split brain" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">דלגו לתוכן</a>

  <div class="app-shell">
    <header class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <span class="eyebrow">חזרה קצרה • מוח גדול, זמן קטן</span>
        <h1 id="page-title">מסע בין שתי ההמיספרות</h1>
        <p>עברו בין ארבע תחנות בקצב שלכם. בשאלות עם תשובה מוגדרת יש עד 3 ניסיונות. בשאלות פתוחות כתבו בקצרה ואז בדקו אם אתם בכיוון.</p>
        <div class="name-entry">
          <label for="participant-name">שם פרטי / כינוי <span>(לא חובה)</span></label>
          <input id="participant-name" type="text" autocomplete="name" maxlength="60" placeholder="איך לקרוא לכם?" />
        </div>
      </div>

      <div class="brain-art" aria-hidden="true">
        <svg viewBox="0 0 300 220" role="img">
          <path class="brain-half brain-half--left" d="M147 37c-28-25-80-16-92 18-25 3-40 23-37 47-17 18-12 51 12 62 2 27 29 44 55 35 16 20 48 19 63 2z"/>
          <path class="brain-half brain-half--right" d="M153 37c28-25 80-16 92 18 25 3 40 23 37 47 17 18 12 51-12 62-2 27-29 44-55 35-16 20-48 19-63 2z"/>
          <path class="brain-line" d="M86 66c24 6 34 20 37 38M54 104c26-8 47 0 58 18M73 153c17-12 35-13 51-5M214 66c-24 6-34 20-37 38M246 104c-26-8-47 0-58 18M227 153c-17-12-35-13-51-5M150 45v146"/>
          <circle class="brain-dot brain-dot--a" cx="84" cy="89" r="7"/>
          <circle class="brain-dot brain-dot--b" cx="215" cy="128" r="7"/>
        </svg>
      </div>
    </header>

    <section class="status-bar" aria-label="התקדמות">
      <div class="progress-copy">
        <span id="stage-label">תחנה 1 מתוך 4</span>
        <span id="progress-label">0% הושלמו</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progress-label">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <nav class="stage-nav" aria-label="תחנות המשחק" id="stage-nav"></nav>

    <main id="main" tabindex="-1">
      <section id="game" class="game-card" aria-live="polite"></section>
    </main>

    <footer class="footer-note">
      <span id="sync-status">התשובות נשמרות במכשיר הזה אוטומטית.</span>
      <button type="button" class="text-button" id="reset-progress">איפוס התקדמות</button>
    </footer>
  </div>

  <template id="question-template">
    <article class="question-card">
      <div class="question-topline">
        <span class="question-number"></span>
        <div class="attempts" aria-label="ניסיונות שנותרו"></div>
      </div>
      <h3 class="question-prompt"></h3>
      <div class="question-body"></div>
      <div class="question-actions">
        <button type="button" class="primary-button check-answer">בדיקת תשובה</button>
      </div>
      <p class="feedback" role="status"></p>
      <div class="answer-reveal" hidden></div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
